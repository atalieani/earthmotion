<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex">
<title>EarthMotion — Community Disaster-Risk Map</title>

<!-- Map libraries (unchanged) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="stylesheet" href="css/styles.css" />

<!-- Stitch design: fonts, icons, Tailwind -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" />
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      surface: "#f0fdf2", "surface-container": "#e5f1e6", "surface-container-low": "#eaf7ec",
      "surface-container-high": "#dfebe1", primary: "#004426", "primary-container": "#1a5d3a",
      secondary: "#006d30", "on-surface": "#131e18", "on-surface-variant": "#404942", outline: "#707971"
    },
    fontFamily: { head: ["Poppins", "sans-serif"], body: ["Plus Jakarta Sans", "sans-serif"] }
  } }
};
</script>

<style>
  html, body { height: 100%; margin: 0; }

  /* Leaflet map fills its section; z-index:0 keeps Leaflet's internal layers below our overlays */
  #map { position: absolute; inset: 0; z-index: 0; }
  .leaflet-top.leaflet-left { left: auto; right: 0; top: 96px; }
  .leaflet-left .leaflet-control { margin-left: 0; margin-right: 12px; }

  /* Reset any old floating-panel styling from css/styles.css */
  #filter-panel { position: static; width: auto; max-width: none; margin: 0; padding: 0;
                  background: none; box-shadow: none; border-radius: 0; max-height: none; overflow: visible; }

  /* Hazard filters rendered by js/map.js, restyled as swipeable chips */
  #category-filters { display: flex; gap: .5rem; overflow-x: auto; padding: .25rem 1rem; margin: 0 -1rem; scrollbar-width: none; }
  #category-filters::-webkit-scrollbar { display: none; }
  #category-filters > * { display: flex; align-items: center; flex: none; padding: .375rem .75rem; border-radius: 9999px;
                          background: rgba(255,255,255,.94); color: #131e18; font-size: .8125rem; font-weight: 500;
                          white-space: nowrap; box-shadow: 0 1px 4px rgba(27,49,36,.18); }
  #category-filters label { display: flex; align-items: center; gap: .35rem; cursor: pointer; }
  #category-filters input { position: absolute; opacity: 0; width: 0; height: 0; }
  #category-filters > *:has(input:checked) { background: #1a5d3a; color: #fff; }
</style>
</head>

<body class="font-body bg-surface text-on-surface flex flex-col h-dvh pt-14 pb-16 overflow-hidden">

<header class="fixed top-0 inset-x-0 z-50 h-14 bg-primary-container text-white flex items-center justify-between gap-3 px-4">
  <a href="index.html" class="flex items-center gap-2 font-head font-semibold text-lg shrink-0"><img src="assets/icons/earthmotion.svg" alt="" class="h-7 w-7">EarthMotion</a>
  <div class="em-auth min-w-0 flex items-center gap-2 text-xs whitespace-nowrap overflow-x-auto" id="auth-widget"></div>
</header>

<!-- Map + floating controls -->
<section class="relative flex-1 min-h-0">
  <div id="map"></div>

  <div class="absolute top-3 inset-x-0 z-30 px-4 flex flex-col gap-2 pointer-events-none">
    <label class="pointer-events-auto self-start flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/95 shadow text-xs font-semibold cursor-pointer has-[:checked]:bg-primary-container has-[:checked]:text-white">
      <input type="checkbox" id="heatmap-toggle" class="peer sr-only" />
      <span class="material-symbols-outlined text-[16px]">local_fire_department</span>
      <span class="peer-checked:hidden">Heatmap off</span>
      <span class="hidden peer-checked:inline">Heatmap on</span>
    </label>
    <div id="category-filters" class="pointer-events-auto"></div>
  </div>
</section>

<!-- Bottom sheet -->
<section id="bottom-sheet" class="relative z-40 bg-white rounded-t-3xl shadow-[0_-6px_24px_rgba(27,49,36,.14)] px-4 pt-3 pb-3">
  <div class="flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 min-w-0">
      <h2 class="font-head font-semibold text-primary text-base">Reports</h2>
      <span id="result-count" class="empty:hidden text-xs font-semibold bg-surface-container-high text-secondary px-2 py-0.5 rounded-full"></span>
    </div>
    <button id="filter-toggle" type="button" aria-expanded="false" aria-controls="filter-drawer"
            class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-surface-container-low text-secondary text-xs font-semibold active:scale-95 transition-transform">
      <span class="material-symbols-outlined text-[16px]">tune</span>Filters
    </button>
  </div>
  <p class="text-xs text-outline mt-1">Tap a marker to see the report.</p>

  <div id="filter-drawer" class="hidden mt-3 bg-surface-container rounded-2xl p-3">
    <div id="filter-panel" class="flex flex-col gap-3">
      <label class="flex flex-col gap-1 text-xs font-semibold text-on-surface-variant">Region
        <select id="region-filter" class="rounded-xl bg-white px-3 py-2 text-sm font-normal text-on-surface">
          <option value="">All regions</option>
        </select>
      </label>
      <div class="grid grid-cols-2 gap-2">
        <label class="flex flex-col gap-1 text-xs font-semibold text-on-surface-variant">From
          <input type="date" id="date-from" class="rounded-xl bg-white px-2 py-2 text-sm font-normal text-on-surface" />
        </label>
        <label class="flex flex-col gap-1 text-xs font-semibold text-on-surface-variant">To
          <input type="date" id="date-to" class="rounded-xl bg-white px-2 py-2 text-sm font-normal text-on-surface" />
        </label>
      </div>
    </div>
  </div>
</section>

<!-- Bottom navigation -->
<nav class="fixed bottom-0 inset-x-0 z-50 h-16 bg-white shadow-[0_-4px_16px_rgba(27,49,36,.08)] flex items-center justify-around text-[11px] text-on-surface-variant">
  <a href="index.html" aria-current="page" class="flex flex-col items-center gap-0.5 w-20 text-primary font-bold">
    <span class="px-4 py-0.5 rounded-full bg-surface-container-high"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">map</span></span>Map
  </a>
  <a href="submit.html" class="flex flex-col items-center gap-0.5 w-20">
    <span class="px-4 py-0.5"><span class="material-symbols-outlined">add_a_photo</span></span>Report
  </a>
  <a href="leaderboard.html" class="flex flex-col items-center gap-0.5 w-20">
    <span class="px-4 py-0.5"><span class="material-symbols-outlined">trophy</span></span>Leaderboard
  </a>
  <a href="admin/index.html" class="flex flex-col items-center gap-0.5 w-20">
    <span class="px-4 py-0.5"><span class="material-symbols-outlined">verified_user</span></span>Moderation
  </a>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script type="module" src="js/map.js"></script>

<script>
  // Open/close the filter drawer, then tell Leaflet the map area changed size
  const toggle = document.getElementById('filter-toggle');
  const drawer = document.getElementById('filter-drawer');
  toggle.addEventListener('click', () => {
    const open = drawer.classList.toggle('hidden') === false;
    toggle.setAttribute('aria-expanded', String(open));
    window.dispatchEvent(new Event('resize'));
  });
</script>
</body>
</html>
